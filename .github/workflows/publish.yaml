name: "Build ISOs and create GitHub Release draft for new versions"

on: # Only run on new version tag push
  push:
    tags:        
      - v*

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - architecture: x86_64
            os: ubuntu-24.04
          - architecture: aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=channel:26.05 # Change me on NixOS upgrades!
      - name: Build ISO images
        run: >
          nix build \
              --system ${{ matrix.architecture }}-linux --out-link result \
              .#nixosConfigurations.${{ matrix.architecture }}.config.system.build.images.iso
      - name: Copy and rename generated ISO file to reflect version and architecture
        run: |
          REAL_ISO_FILENAME=$(readlink -f $(find result/iso/ -name "nixos-*.iso" -print -quit))
          cp "$REAL_ISO_FILENAME" \
            nixos-cloud-init-installer-${{ github.ref_name }}-${{ matrix.architecture }}.iso
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: iso-artifact-${{ matrix.architecture }}
          path: nixos-cloud-init-installer-${{ github.ref_name }}-${{ matrix.architecture }}.iso
  create-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: iso-artifacts
          pattern: iso-artifact-*
          merge-multiple: true
      - name: Create GitHub Release
        id: create-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          draft: true
          generate_release_notes: true
          files: iso-artifacts/*.iso
      - name: Create GitHub Release notification summary
        run: |
          printf "# 🎉 Release ready!\n\n" >> $GITHUB_STEP_SUMMARY
          printf "The link to the release (tag **%s**, ID **%s**) is: %s\n\n" \
            "${{ github.ref_name }}" \
            "${{ steps.create-release.outputs.id }}" \
            "${{ steps.create-release.outputs.url }}" \
            >> $GITHUB_STEP_SUMMARY
          printf "Note that the release is still yet unpublished, \
          so you will need to manually publish it.\n\n" \
            >> $GITHUB_STEP_SUMMARY
          printf "Generated at: %s\n" \
            "$(date -u +"%Y-%m-%d %H:%M:%S UTC")" \
            >> $GITHUB_STEP_SUMMARY
