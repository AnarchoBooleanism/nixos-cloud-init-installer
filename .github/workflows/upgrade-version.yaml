name: Upgrade NixOS version 
on:
  workflow_dispatch:
  schedule:
    # At 01:00 on day-of-month 7, every June & December (roughly a week or two after NixOS release)
    - cron: '0 1 7 6,12 *'

permissions:
  pull-requests: write
  contents: write

env:
  NIXOS_RELEASES_API_URL: "https://endoflife.date/api/v1/products/nixos/"

jobs:
  upgrade-nixos-version:
    runs-on: ubuntu-latest
    environment:
      name: nix-commit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          fingerprint: ${{ secrets.GPG_FINGERPRINT }}
          trust_level: 5
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Check Nix flake inputs
        uses: DeterminateSystems/flake-checker-action@v13
        with:
          check-owner: false # We're using non-NixOS inputs here
          check-outdated: false # This is the workflow for updating...
          fail-mode: true
      - name: Get NixOS version listed in repository
        run: |
          version=$(nix flake metadata --json | jq -r '
            .locks.nodes.root.inputs.nixpkgs as $root_pkgs
            | .locks.nodes[$root_pkgs].original.ref
            | sub("nixos-"; "")
          ')

          printf "The current NixOS version of the repository is %s\n" "${version}"
          printf "CURRENT_NIXOS_VERSION=%s\n" "${version}" >> $GITHUB_ENV
      - name: Find the latest available NixOS version
        run: |
          # ASSUMPTION: .results.releases is in reverse chronological order!
          # Find latest release that actually has been released
          today_date=$(date +%F) # For consistency
          latest_release=$(curl -s "${NIXOS_RELEASES_API_URL}" | jq -r \
            --arg today "$today_date" \
            '.result.releases[] | select(.releaseDate <= $today) | .name' \
            | head -n 1)
          
          if [[ -z "${latest_release}" ]] ; then
              printf "Error: No NixOS release is available to use for today (%s)! Is your time set correctly?\n" "${today_date}" >&2
              exit 1
          fi

          printf "Found latest NixOS release: %s\n" "${latest_release}"
          printf "LATEST_NIXOS_RELEASE=%s\n" "${latest_release}" >> $GITHUB_ENV
      - name: Compare repository's NixOS version to latest available release
        run: |
          if [[ "${CURRENT_NIXOS_VERSION}" != "${LATEST_NIXOS_RELEASE}" ]] ; then
            printf "An upgrade is available, to NixOS %s (currently on NixOS %s)\n" "${LATEST_NIXOS_RELEASE}" "${CURRENT_NIXOS_VERSION}"
            printf "%s\n" "NIXOS_UPGRADE_AVAILABLE=true" >> $GITHUB_ENV
          else
            printf "Already on the latest NixOS version (%s)\n" "${CURRENT_NIXOS_VERSION}"
            printf "%s\n" "NIXOS_UPGRADE_AVAILABLE=false" >> $GITHUB_ENV
          fi
      - name: Change version number for nixpkgs input in flake.nix
        run: |
          # Since how we found the NixOS version in an earlier step depends on the lock file,
          # but we are modifying flake.nix, we need to be able to match any version that is
          # already in flake.nix, in case there is a mismatch.
          sed -E -i "s|(nixpkgs\.url = \"github:nixos/nixpkgs/nixos-)[0-9]{2}\.[0-9]{2}|\1${LATEST_NIXOS_RELEASE}|" flake.nix
        if: env.NIXOS_UPGRADE_AVAILABLE == 'true'
      - name: Update flake.lock
        run: |
          # Might as well do all inputs
          nix flake update --commit-lock-file

          # Save commit message from lock file update as environment variable
          DELIMITER=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          COMMIT_MESSAGE="$(git log --format=%b -n 1)"
          printf "GIT_COMMIT_MESSAGE<<%s\n" "${DELIMITER}" >> $GITHUB_ENV
          printf "%s\n" "$COMMIT_MESSAGE" >> $GITHUB_ENV
          printf "%s\n" "$DELIMITER" >> $GITHUB_ENV
          printf "GIT_COMMIT_MESSAGE is: %s\n" "${COMMIT_MESSAGE}"

          # Remove above commit (we just needed it for the PR body) while keeping changes
          git reset --soft HEAD~1
        if: env.NIXOS_UPGRADE_AVAILABLE == 'true'
      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "upgrade: Change NixOS flake version to ${{ env.LATEST_NIXOS_RELEASE }}"
          branch: "nixos-upgrade-${{ env.LATEST_NIXOS_RELEASE }}"
          sign-commits: true
          title: "upgrade: Change NixOS flake version to ${{ env.LATEST_NIXOS_RELEASE }}"
          body: |
            This commit upgrades the version of NixOS, as referred to as the nixpkgs input, from ${{ env.CURRENT_NIXOS_VERSION }} to ${{ env.LATEST_NIXOS_RELEASE }}.

            ```
            ${{ env.GIT_COMMIT_MESSAGE }}
            ```
          add-paths: |
            flake.nix
            flake.lock
        if: env.NIXOS_UPGRADE_AVAILABLE == 'true'
