# Comes from https://github.com/god464/flake/blob/master/.github/workflows/update.yml

name: Update flake.lock
on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 0" # Every Sunday at 12:00 PM

permissions:
  pull-requests: write
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    environment:
      name: nix-commit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Check Nix flake inputs
        uses: DeterminateSystems/flake-checker-action@v13
        with:
          check-outdated: false # This is the workflow for updating...
          fail-mode: true
      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@v28
        with:
          branch: chore/update-flake-lock
          commit-msg: "chore[bump]: Update flake.lock"
          pr-title: "chore[bump]: Update flake.lock"
          pr-labels: dependencies,nix
          sign-commits: true
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-fingerprint: ${{ secrets.GPG_FINGERPRINT }} # specify subkey fingerprint (optional)
