# Comes from https://github.com/Swarsel/.dotfiles/blob/main/.github/workflows/flake-checks.yaml

name: Flake check
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
    paths-ignore:
      - ".github/**" # Avoid issues with .github files
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"

jobs:
  flake-check:
    name: Check flake
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Use Magic Nix Cache to cache builds between workflows
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Check Nix flake inputs
        uses: DeterminateSystems/flake-checker-action@de924abd783455e8429c858962b9e43062d19da1 # v13
        with:
          fail-mode: true
          check-outdated: false # update.yaml should take care of this
      - name: Check for dead code in .nix files
        run: git ls-files '*.nix' | nix run nixpkgs#deadnix
        continue-on-error: true
      - name: Check for lints in .nix files
        run: nix run nixpkgs#statix -- check
        continue-on-error: true
      - name: Check formatting in .nix files
        run: git ls-files '*.nix' | xargs nix run nixpkgs#nixfmt -- --check
        continue-on-error: true
      - name: Check whether the flake builds
        run: nix flake check --all-systems --keep-going --debug .
